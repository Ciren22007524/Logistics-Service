name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: logistics
          POSTGRES_PASSWORD: logistics-local-only
          POSTGRES_DB: logistics_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U logistics" --health-interval 2s --health-timeout 3s --health-retries 30
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      TEST_DATABASE_URL: postgresql://logistics:logistics-local-only@127.0.0.1:5432/logistics_test
      TEST_REDIS_URL: redis://127.0.0.1:6379/15
      # 測試專用，非正式金鑰
      CREDENTIALS_ENC_KEYS: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
